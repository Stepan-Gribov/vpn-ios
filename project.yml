name: TnDtun
options:
  bundleIdPrefix: com.example.vpnapp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "53"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    APP_GROUP_IDENTIFIER: group.com.example.vpnapp
    "APP_GROUP_IDENTIFIER[sdk=macosx*]": $(DEVELOPMENT_TEAM).com.example.vpnapp.mac
    SWIFT_STRICT_CONCURRENCY: minimal
    VPNAPP_RECOVERY_URL: ""
packages:
  SwiftyXrayKit:
    path: Packages/SwiftyXrayKit
targets:
  TnDtun:
    type: application
    platform: iOS
    sources: [App, Core, Shared, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vpnapp
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]": com.example.vpnapp.mac
        TUNNEL_BUNDLE_IDENTIFIER: com.example.vpnapp.PacketTunnel
        "TUNNEL_BUNDLE_IDENTIFIER[sdk=macosx*]": com.example.vpnapp.mac.PacketTunnel
        PRODUCT_NAME: TnDtun
        PRODUCT_MODULE_NAME: TnDtun
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Mac.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PacketTunnel
        embed: true
      - package: SwiftyXrayKit
      - sdk: NetworkExtension.framework
      - sdk: WebKit.framework
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - Shared
      - Core/Models.swift
      - path: Resources/geoip.dat
        optional: true
        buildPhase: resources
      - path: Resources/geosite.dat
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vpnapp.PacketTunnel
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]": com.example.vpnapp.mac.PacketTunnel
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": PacketTunnel/Mac.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: SwiftyXrayKit
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: libresolv.tbd
  TnDtunTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TnDtun.app/TnDtun"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/TnDtun.app/Contents/MacOS/TnDtun"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: TnDtun
  TnDtunUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TEST_TARGET_NAME: TnDtun
    dependencies:
      - target: TnDtun
schemes:
  TnDtun:
    build:
      targets:
        TnDtun: all
    run:
      executable: TnDtun
    test:
      macroExpansion: TnDtun
      targets:
        - TnDtunTests
        - TnDtunUITests
